{% extends 'base.html' %}

{% block title %}contact page{% endblock %}

{% block content %}

<div class="container text-4xl p-5 mx-auto my-9 text-orange-400 bg-black text-center rounded">
    <h1>Contact Me</h1>
</div>
<form method="post" action="{% url 'contact' %}">
{% csrf_token %}

<div class=" flex flex-col md:flex-row justify-center gap-6 md:gap-10 px-4">
    
    <div class="left flex flex-col gap-5 w-full md:w-1/3 text-white font-sans">
        <input type="text" name="name" placeholder="Name" class="bg-gray-900 p-3 rounded-xl outline-none  w-full">
        <input type="text" name="phone" placeholder="Phone Number" class="bg-gray-900 p-3 rounded-xl outline-none w-full">
        <input type="text" name="timeline" placeholder="Timeline" class="bg-gray-900 p-3 rounded-xl outline-none t w-full">
    </div>

    <div class="right flex flex-col gap-5 w-full md:w-1/3 text-white font-sans">
        <input type="text" name="email" placeholder="Email" class="bg-gray-900 p-3 rounded-xl outline-none  w-full">
        <input type="text" name="services" placeholder="Services of interest"  id="sinput" class="bg-gray-900 p-3 rounded-xl outline-none w-full ">
        <textarea placeholder="Message..." name="message" class="bg-gray-900 p-3 rounded-xl outline-none w-full h-32"></textarea>
        <div class="flex justify-end">
            <button type="submit" class="px-4 py-2 border border-green-500 relative before:absolute before:inset-0 before:w-0 hover:before:w-full before:bg-green-500 before:transition-all before:duration-200 before:-z-10 rounded-md text-white hover:text-white overflow-hidden"> Submit</button>
        </div>
    </div>
</div>
</form>

{% endblock %}
