
{% extends 'base.html' %}

{% block title %}contact page{% endblock %}

{% block content %}

<div class="container text-4xl p-5 mx-auto my-9 text-orange-500 text-center">
    <h1>Contact <span class="text-white">Me</span> </h1>
</div>

<form method="post" action="{% url 'contact' %}">
{% csrf_token %}

<div class="flex flex-col md:flex-row justify-center gap-6 md:gap-10 px-4">

    <div class="left flex flex-col gap-5 w-full md:w-1/3 text-white font-sans">
        <input type="text" name="name" placeholder="Name" class="bg-[#111720] text-white placeholder-[#94A3B8] border border-[#27313D] focus:border-[#A3FF12] p-3 rounded-xl outline-none w-full">
        <input type="text" name="phone" placeholder="Phone Number" class="bg-[#111720] text-white placeholder-[#94A3B8] border border-[#27313D] focus:border-[#A3FF12] p-3 rounded-xl outline-none w-full">
        <input type="text" name="timeline" placeholder="Timeline" class="bg-[#111720] text-white placeholder-[#94A3B8] border border-[#27313D] focus:border-[#A3FF12] p-3 rounded-xl outline-none w-full">
    </div>

    <div class="right flex flex-col gap-5 w-full md:w-1/3 text-white font-sans">
        <input type="text" name="email" placeholder="Email" class="bg-[#111720] text-white placeholder-[#94A3B8] border border-[#27313D] focus:border-[#A3FF12] p-3 rounded-xl outline-none w-full">
        <input type="text" name="services" placeholder="Services of interest" id="sinput" class="bg-[#111720] text-white placeholder-[#94A3B8] border border-[#27313D] focus:border-[#A3FF12] p-3 rounded-xl outline-none w-full">
        <textarea placeholder="Message..." name="message" class="bg-[#111720] text-white placeholder-[#94A3B8] border border-[#27313D] focus:border-[#A3FF12] p-3 rounded-xl outline-none w-full h-32"></textarea>

        <div class="flex justify-end">
            <button type="submit" class="px-4 py-2 border border-[#A3FF12] bg-[#A3FF12] text-[#080B10] font-semibold relative rounded-md hover:bg-[#C4FF52] hover:border-[#C4FF52] transition-all duration-200">
                Submit
            </button>
        </div>
    </div>
</div>
</form>

{% endblock %}
